<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>恐龍偵探！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111111; --bg-deep:#000000; --card:#1E1E1E; --card-2:#262626;
  --beige:#FFFFFF; --orange:#FFD400; --orange-dark:#E6BE00; --earth:#FFD400;
  --yellow:#FFD400; --acid:#B6FF2E; --emerald:#00D68F; --green:#B6FF2E; --pink:#FF3DBE; --ink-pink:#FF3DBE; --ink-ok:#B6FF2E; --red:#FF3B4E; --ink-red:#FF3B4E;
  --text:#FFFFFF; --text-muted:#A0A0A0; --border:rgba(255,255,255,.14);
  --correct:#B6FF2E; --wrong:#FFFFFF; --gray-tag:#5A5A5A;
  --neon-tri:#FFD400; --neon-jur:#B6FF2E; --neon-cre:#00D68F;
  --dark-era:#3A3A3A; --dark-era-text:#7A7A7A;
  --panel:#0A0A0A;
  --shadow:0 4px 14px rgba(0,0,0,.25); --shadow-hover:0 10px 24px rgba(0,0,0,.35);
  --nav-h:60px; --df:#FFD400; --dl:#111111;
  interpolate-size:allow-keywords;
}
*{box-sizing:border-box}
html{color-scheme:dark light;scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);color:var(--text);
  font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.7;overflow-x:hidden}
h1,h2,h3{font-family:"Noto Sans TC",sans-serif;font-weight:700;line-height:1.35;margin:0 0 .4em}
h1{font-size:34px} h2{font-size:25px} h3{font-size:19px}
p{margin:0 0 1em}
a{color:var(--orange)}
a:hover{color:var(--beige)}
.small{font-size:14px}
.muted{color:var(--text-muted)}
.ic{width:1em;height:1em;flex:none;color:var(--beige)}
button{font-family:inherit;font-size:16px;cursor:pointer}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:50;display:flex;align-items:center;gap:16px;
  padding:0 20px;background:rgba(0,0,0,.95);border-bottom:1px solid var(--border);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--text);font-weight:700;font-size:21px;white-space:nowrap}
.brand .ic{width:28px;height:28px}
.nav-links{flex:1;display:flex;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{background:none;border:0;padding:6px 12px;color:var(--text);font-weight:700;white-space:nowrap;border-bottom:3px solid transparent;border-radius:0}
.nav-link:hover{color:var(--orange)}
.nav-link.active{border-bottom-color:var(--orange)}
.judge-switch{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none}
.judge-switch input{position:absolute;opacity:0;width:0;height:0}
.track{width:42px;height:24px;border-radius:12px;background:#3A3A3A;position:relative;transition:background .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.judge-switch input:checked + .track{background:var(--orange)}
.judge-switch input:checked + .track::after{transform:translateX(18px)}
.judge-switch input:focus-visible + .track{outline:2px solid var(--beige);outline-offset:2px}
.judge-banner{position:fixed;top:var(--nav-h);left:0;right:0;z-index:49;background:var(--orange);color:var(--bg-deep);font-weight:700;
  font-size:14px;text-align:center;padding:4px 12px;display:none}
body.judge-on .judge-banner{display:block}

/* ---------- layout ---------- */
main{position:relative;z-index:1;padding-top:calc(var(--nav-h) + 24px);padding-bottom:64px}
body.judge-on main{padding-top:calc(var(--nav-h) + 56px)}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.section{display:none;animation:fade .25s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--border);border-radius:0;box-shadow:var(--shadow);padding:24px;text-align:center}
.section-head{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 6px;text-align:center}
.section-head .ic{width:30px;height:30px}
.section-head h2{margin:0}
.center{text-align:center}
.back{background:none;border:0;color:var(--beige);font-weight:700;padding:4px 0;margin:0 16px 8px 0}
.back:hover{color:var(--orange)}
.back-row{display:flex;flex-wrap:wrap;gap:4px}
.divider{display:flex;align-items:center;gap:14px;margin:36px 0}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:var(--border)}
.divider .ic{width:44px;height:44px}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:0;padding:12px 26px;font-weight:700;transition:background .15s,transform .15s,color .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--beige);color:var(--bg-deep)}
.btn-primary:hover{background:#fff}
.btn-accent{background:var(--orange);color:var(--bg-deep)}
.btn-accent:hover{background:#FFE34D}
.btn-secondary{background:transparent;color:var(--beige);border:2px solid var(--beige)}
.btn-secondary:hover{background:rgba(255,255,255,.08)}
.btn:disabled{background:#333;color:#777;border-color:#333;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- home ---------- */
.home{position:relative;min-height:calc(100vh - var(--nav-h) - 88px);display:grid;grid-template-columns:55fr 45fr;gap:40px;align-items:center}

.deco-amm{position:fixed;pointer-events:none;z-index:0;opacity:.8;color:var(--yellow)}
.deco-s{position:fixed;pointer-events:none;z-index:0;opacity:.85;-webkit-mask-size:22px 22px;mask-size:22px 22px}
.deco-s.s1{width:70px;height:70px;left:2.5%;top:44%;transform:rotate(-24deg);color:var(--emerald)}
.deco-s.s2{width:72px;height:72px;right:3%;top:42%;transform:rotate(30deg);color:var(--yellow)}
.deco-s.s3{width:180px;height:100px;left:1%;top:66%;transform:rotate(-8deg);color:var(--yellow)}
.deco-s.s4{width:95px;height:150px;right:2%;top:58%;transform:rotate(12deg);color:var(--emerald)}
.deco-s.s5{width:56px;height:56px;left:14%;top:12%;transform:rotate(15deg);color:var(--yellow)}
.deco-s.s6{width:54px;height:54px;right:16%;bottom:6%;transform:rotate(-30deg);color:var(--acid)}
.deco-s.s7{width:160px;height:72px;right:22%;top:9%;transform:rotate(4deg);color:var(--acid)}
.deco-s.s8{width:68px;height:68px;left:20%;bottom:5%;transform:rotate(40deg);color:var(--emerald)}
.deco-amm.tr{width:230px;height:230px;top:70px;right:-80px;transform:rotate(-20deg)}
.deco-amm.bl{width:200px;height:200px;bottom:-60px;left:-60px;transform:rotate(35deg)}
.intro{text-align:center}
.home .subtitle{color:var(--orange);font-size:20px;font-weight:700;margin-bottom:18px}
.figure{margin:4px auto 20px;max-width:420px}
.figure img{display:block;width:100%;border-radius:14px;border:2px solid var(--border)}
.figure figcaption{font-size:14px;color:var(--text-muted);margin-top:6px}
.menu{display:flex;flex-direction:column;gap:16px;align-items:center}
.menu-card{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;width:100%;max-width:420px;background:var(--card);
  border:1px solid var(--border);border-radius:0;padding:18px 20px;box-shadow:var(--shadow);color:var(--text);
  position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.menu-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--orange);transform:scaleY(0);transition:transform .15s}
.menu-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.menu-card:hover::before{transform:scaleY(1)}
.menu-card .ic{width:52px;height:52px;margin-bottom:2px}
.menu-card .t{display:block;font-size:20px;font-weight:700}
.menu-card .d{display:block;font-size:14px;color:var(--text-muted)}
.menu-card .arrow{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--orange)}

/* ---------- quiz ---------- */
.lead{text-align:center}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px auto 0;max-width:900px}
.mode-card{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.mode-card .btn{margin-top:auto}
.mode-card.full{grid-column:1 / -1}
.quota-tag{display:inline-block;background:var(--wrong);color:var(--bg-deep);font-size:13px;font-weight:700;border-radius:6px;padding:2px 10px}
.remain{font-size:14px;color:var(--orange);font-weight:700}
.q-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:12px auto 18px;max-width:640px}
.q-head .prog-text{font-weight:700}
.q-head .stats{margin-left:auto;display:flex;gap:16px;font-size:14px;color:var(--text-muted)}
.q-head .stats b{color:var(--text);font-size:16px}
.progress{flex-basis:100%;height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--orange);border-radius:5px;transition:width .3s}
.flip{perspective:1400px;max-width:640px;margin:0 auto}
.flip-inner{display:grid;transition:transform .5s;transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.face.face-back{transform:rotateY(180deg)}
.face .tag-ai{position:absolute;top:16px;right:16px;font-size:12px;background:var(--orange);color:var(--bg-deep);font-weight:700;border-radius:6px;padding:2px 8px}
.face.face-front{position:relative;justify-content:space-between}
.statement{font-size:25px;font-weight:700;text-align:center;margin:28px 8px;flex:1;display:flex;align-items:center;justify-content:center}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.tf button{height:64px;font-size:20px;font-weight:700;border:0;border-radius:0;transition:transform .15s,filter .15s}
.tf button:hover{transform:translateY(-2px);filter:brightness(1.07)}
.tf .t{background:var(--correct);color:var(--bg-deep)} .tf .f{background:var(--wrong);color:var(--bg-deep)}
.res-title{font-size:28px;font-weight:700;margin-bottom:4px}
.res-title.ok{color:var(--correct)} .res-title.no{color:var(--wrong)}
.face.face-back .btn{margin-top:auto}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:300px;text-align:center;color:var(--text-muted)}
.loader .ic{width:52px;height:52px;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cert{position:relative;max-width:560px;margin:8px auto 24px;padding:28px 28px 32px;text-align:center;background:var(--card);
  border:4px double var(--beige);border-radius:0}
.cert .corner{position:absolute;width:26px;height:26px}
.cert .c1{top:8px;left:8px}.cert .c2{top:8px;right:8px}.cert .c3{bottom:8px;left:8px}.cert .c4{bottom:8px;right:8px}
.mascot{display:block;width:210px;height:188px;margin:0 auto 8px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.cert .score{font-size:30px;font-weight:700}
.cert .title-label{font-size:14px;color:var(--text-muted);margin-top:12px}
.cert .title{font-size:28px;font-weight:700;color:var(--orange)}
.review{max-width:760px;margin:0 auto 24px;text-align:center}
.review-item{border-left:5px solid var(--wrong);background:var(--card);border-radius:0;padding:14px 18px;margin-bottom:12px;text-align:center}
.review-item .s{font-weight:700}
.trivia-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px;align-items:start}
.trivia-col h3{font-size:22px;margin:0 0 4px;text-align:center}
.trivia-col .col-sub{text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:14px}
.trivia-col.true h3{color:var(--correct)} .trivia-col.false h3{color:var(--wrong)}
.trivia-list{display:flex;flex-direction:column;gap:16px}
.tcard{perspective:1200px;cursor:pointer}
.tcard .flip-inner{height:100%}
.tcard .face{min-height:230px;padding:20px}
.tcard.flipped .flip-inner{transform:rotateY(180deg)}
.tcard .face-front{justify-content:center;position:relative}
.tcard .face-front .q{font-size:20px;font-weight:700;text-align:center;margin:18px 0}
.tcard .face-front .hint{position:absolute;right:16px;bottom:12px;font-size:13px;color:var(--text-muted)}
.diff{position:absolute;top:14px;left:14px;font-size:12px;border:1px solid var(--beige);color:var(--beige);border-radius:6px;padding:0 8px}
.verdict{display:inline-block;color:var(--bg-deep);border-radius:6px;padding:1px 10px;font-size:14px;font-weight:700;margin-bottom:8px}
.verdict.t{background:var(--correct)} .verdict.f{background:var(--wrong)}
.tcard .face-back p{font-size:15px;margin-bottom:.6em}
.tcard .face-back .st{font-weight:700}

/* ---------- image challenge ---------- */
.img-play{display:grid;grid-template-columns:55fr 45fr;gap:28px;align-items:start}
.img-play img{width:100%;border-radius:14px;border:2px solid var(--border);display:block}
.img-play figcaption{font-size:14px;color:var(--text-muted);margin-top:6px;text-align:center}
.img-q{text-align:center}
.opts{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px;text-align:left}
.opt{display:block;background:var(--card);border:2px solid var(--border);border-radius:0;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.opt:hover{border-color:var(--beige)}
.opt input{accent-color:var(--orange);width:18px;height:18px;vertical-align:-3px;margin-right:8px}
.opt.locked{cursor:default}
.opt .mark{display:block;font-size:14px;font-weight:700;margin-top:6px}
.mark.ok{color:var(--correct)} .mark.bad{color:var(--wrong)} .mark.miss{color:var(--orange)}
.opt .exp{display:block;font-size:14px;color:var(--text-muted);margin-top:4px}
.verdict-line{font-size:22px;font-weight:700;margin-bottom:12px}
.mini-review{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;max-width:900px;margin:0 auto 24px}
.mini-review .card{padding:12px}
.mini-review img{width:100%;border-radius:10px;display:block;margin-bottom:8px}

/* ---------- history ---------- */
.overview{text-align:center}
.overview .bars{position:relative;margin-top:30px;text-align:left}
.bar-svg{display:block;width:100%;height:28px;overflow:visible}
.bar-labels{position:relative;height:56px}
.bar-labels.top{height:40px}
.ev{position:absolute;transform:translateX(-50%);font-size:13px;white-space:nowrap;color:var(--text-muted)}
.ev::before{content:"";position:absolute;left:50%;width:1px;background:var(--text-muted);opacity:.6}
.ev.neon{color:var(--neon-jur)}
.bar-labels.bottom .ev{top:6px;padding-top:2px} .bar-labels.bottom .ev::before{top:-6px;height:6px}
.bar-labels.top .ev{bottom:4px} .bar-labels.top .ev::before{bottom:-4px;height:4px}
.ev.edge-l{transform:none} .ev.edge-l::before{left:0}
.ev.edge-r{transform:translateX(-100%)} .ev.edge-r::before{left:100%}
.ev.dot{width:9px;height:9px;border-radius:50%;background:var(--neon-jur);box-shadow:0 0 6px var(--neon-jur);font-size:0;padding:0;cursor:help}
.ev.dot::before{display:none}
.ev.dot:hover::after,.ev.dot:focus::after{content:attr(data-label);position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:12px;background:#000;color:#fff;padding:2px 6px;border-radius:4px;white-space:nowrap}
.zoom-svg{display:block;width:100%;height:40px}
.meso-tag{position:absolute;font-size:14px;font-weight:700;color:var(--neon-jur);transform:translateX(-50%);top:-24px;white-space:nowrap}
.neon-bar{filter:drop-shadow(0 0 5px currentColor) drop-shadow(0 0 12px currentColor)}
.day-fact{margin-top:22px;
  font-size:20px;font-weight:700;line-height:1.6;text-align:center}
.day-fact .hl{color:var(--neon-tri)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--text-muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.timeline{position:relative;margin-top:30px}
.era{position:relative;padding:8px 0 20px}
.era::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:var(--era-c)}
.era-dark{--era-c:var(--dark-era)}
.era-tri{--era-c:var(--neon-tri)} .era-jur{--era-c:var(--neon-jur)} .era-cre{--era-c:var(--neon-cre)}
.era-neon::before{box-shadow:0 0 8px var(--era-c),0 0 18px var(--era-c)}
.era-head{position:relative;z-index:1;max-width:520px;margin:0 auto 22px;text-align:center;border-radius:0;padding:10px 18px}
.era-dark .era-head{background:#E9E9E9;color:#111;border:1px solid #BDBDBD}
.era-dark .era-head h3{color:#111}
.era-neon .era-head{background:var(--era-c);color:#111;border:0;box-shadow:0 0 10px var(--era-c),0 0 22px color-mix(in srgb,var(--era-c) 60%,transparent)}
.era-neon .era-head h3{color:#111;font-size:24px}
.era-head h3{margin:0;font-size:19px}
.era-head .range{font-size:13px;opacity:.9}
.era-head p{margin:2px 0 0;font-size:14px;opacity:.95}
.era-more{padding:0}
.era-more summary{list-style:none;cursor:pointer;padding:10px 18px;display:flex;flex-direction:column;align-items:center}
.era-more summary::-webkit-details-marker{display:none}
.era-more summary:hover{background:rgba(0,0,0,.05)}
.era-more .toggle-txt{color:#111;margin-top:4px;font-size:13px}
.era-body{padding:4px 22px 18px;border-top:1px solid #BDBDBD}
.era-body h4{margin:12px 0 6px;font-size:20px;color:#111}
.era-body p{font-size:15px;line-height:1.75;opacity:1}
.era-body .evi-title{margin:14px 0 8px;font-size:15px;color:#111}
.era-body .evi{background:rgba(0,0,0,.07);padding:8px 12px;margin:0 0 6px;font-size:14px;line-height:1.6}
.era-body .evi b{display:block;color:#111;font-size:15px}
.era-body .closing{margin-top:12px;font-weight:700}
.era-body .small{font-size:12px}
.era-body a{color:#111}
.dino-era-banner{text-align:center;font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--neon-tri);margin:4px 0 18px}
.event{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 26px}
.event .dia{width:18px;height:18px;background:var(--wrong);transform:rotate(45deg);flex:none;box-shadow:0 0 8px var(--wrong)}
.event .txt{background:var(--bg-deep);border:2px solid var(--wrong);color:var(--wrong);border-radius:0;padding:6px 14px;font-weight:700;font-size:15px;text-align:center}
.event .txt span{display:block;font-weight:400;font-size:13px;color:var(--text-muted)}
.node{position:relative;width:calc(50% - 36px);margin-bottom:18px}
.node.left{margin-right:auto} .node.right{margin-left:auto}
.node::after{content:"";position:absolute;top:calc(9px + clamp(100px,13vw,140px)/2);width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--era-c)}
.era-neon .node::after{box-shadow:0 0 8px var(--era-c)}
.node.left::after{right:-45px} .node.right::after{left:-45px}
.node details{background:var(--card);border:1px solid var(--border);border-radius:0;box-shadow:var(--shadow);overflow:hidden;text-align:center}
.era-neon .node details{border:1.5px solid color-mix(in srgb,var(--era-c) 70%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--era-c) 35%,transparent)}
.era-dark .node details{background:#1A1A1A;filter:saturate(.55) brightness(.82);transition:filter .2s}
.era-dark .node details:hover,.era-dark .node details[open]{filter:none}
.node summary{list-style:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;cursor:pointer;position:relative}
.node summary::-webkit-details-marker{display:none}
.node summary:hover{background:rgba(255,255,255,.04)}
.fossil{display:block;width:100%;max-width:240px;height:clamp(100px,13vw,140px);color:var(--glow-c);flex:none;transition:transform .2s;filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 0 10px color-mix(in srgb,currentColor 55%,transparent))}
.era-neon .fossil{color:var(--era-c)}
.node summary:hover .fossil{transform:scale(1.05)}
.node summary h3{margin:0;font-size:20px}
.node .meta{margin:0 0 14px}
.node .meta .sci{font-size:14px}
.node .sci{display:block;font-style:italic;font-size:13px;color:var(--text-muted);font-weight:400}
.node .age{font-size:14px;margin:2px 0 4px}
.gtag{display:inline-block;font-size:12px;color:var(--bg-deep);font-weight:700;border-radius:6px;padding:0 8px;margin:0 2px}
.g-theropod{background:var(--orange)} .g-sauro{background:var(--correct)} .g-ornith{background:var(--emerald)} .g-early{background:#FFFFFF} .g-non{background:var(--gray-tag);color:#fff} .g-bird{background:#FFFFFF}
.notdino{display:inline-block;font-size:12px;border:1px solid var(--gray-tag);color:#A0A0A0;border-radius:6px;padding:0 6px}
.toggle-txt{font-size:14px;color:var(--orange);white-space:nowrap;font-weight:700}
.toggle-txt::after{content:"展開 ▾"}
details[open] .toggle-txt::after{content:"收合 ▴"}
.node .body{padding:0 18px 18px}
details::details-content{block-size:0;overflow:hidden;opacity:0;transition:block-size .4s ease,opacity .4s ease,content-visibility .4s allow-discrete}
details[open]::details-content{block-size:auto;opacity:1}
.node .body img{width:100%;border-radius:12px;display:block}
.node .body .cap{font-size:13px;color:var(--text-muted);margin:4px 0 12px}
.facts{margin:0 auto 12px;border-collapse:collapse;font-size:14px}
.facts th{color:var(--text-muted);font-weight:500;padding:4px 12px 4px 0;vertical-align:top;text-align:right;white-space:nowrap}
.facts td{padding:4px 0;text-align:left}
.tip{border:2px solid var(--orange);background:rgba(255,212,0,.08);border-radius:0;padding:10px 14px;margin:10px 0;font-size:15px}
.cmp{margin-top:10px}
.cmp-form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin:14px 0;text-align:left}
.cmp-form label{font-size:14px;color:var(--text-muted);display:flex;flex-direction:column;gap:4px}
select{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--border);background:var(--bg-deep);color:var(--text)}
.cmp-bar{position:relative;height:56px;background:rgba(255,255,255,.08);border-radius:10px;margin:12px 0 6px}
.cmp-range{position:absolute;height:16px;border-radius:4px;min-width:3px}
.cmp-range.a{background:var(--orange);top:10px;box-shadow:0 0 8px var(--orange)} .cmp-range.b{background:var(--correct);top:30px;box-shadow:0 0 8px var(--correct)}
.cmp-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)}
.cmp-big{font-size:25px;font-weight:700;margin:12px 0 4px}
.cmp-key{display:flex;gap:16px;font-size:14px;flex-wrap:wrap;justify-content:center}
.cmp-key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ---------- about ---------- */
.about-grid{display:flex;flex-direction:column;gap:20px;margin:16px auto 0;max-width:900px}
.arch{display:flex;flex-direction:column;gap:10px;align-items:center}
.arch-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.arch-box{background:var(--bg-deep);border:2px solid var(--beige);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700}
.arch-box.ai{border-color:var(--orange);color:var(--orange)}
.arch-arrow{color:var(--beige)}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:10px 8px;text-align:center;vertical-align:top}
.tbl th{color:var(--text-muted);font-weight:500}
.eval{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{border:1px solid var(--border);border-radius:0;padding:14px;background:var(--bg-deep)}
.stat .v{font-size:25px;font-weight:700}
.stat .v.pending{font-size:18px;color:var(--text-muted)}
.bars-cmp{margin-top:14px}
.bar-row{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.bar-track{height:14px;background:rgba(255,255,255,.1);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;background:var(--orange)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--beige);color:var(--beige);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700}

/* ---------- judge panel ---------- */
.jp{display:none;background:var(--panel);color:#EEEEEE;border:1px solid rgba(255,212,0,.4);border-radius:0;padding:16px 18px;margin:20px 0;font-size:14px;
  font-family:"Noto Sans Mono",ui-monospace,monospace;text-align:left}
body.judge-on .jp{display:block}
.jp .jp-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.jp .jp-head b{font-family:"Noto Sans TC",sans-serif;font-size:16px;color:var(--orange)}
.jp .jp-head span{font-family:"Noto Sans TC",sans-serif;font-size:12px;opacity:.75}
.jp details{border-top:1px solid rgba(255,255,255,.14);padding:6px 0}
.jp summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-family:"Noto Sans TC",sans-serif}
.jp summary .meta{opacity:.7;font-size:12px;white-space:nowrap}
.jp pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 4px;font-family:inherit;font-size:13px;line-height:1.55;color:#D5D5D5}
.jp .pass{color:var(--correct)} .jp .fail{color:var(--wrong)}

/* ---------- responsive ---------- */

/* 答題區上下置中：扣掉導覽列、返回按鈕與區塊標題後的剩餘高度 */
.play-stage{min-height:calc(100vh - 240px);display:flex;flex-direction:column;justify-content:center}
.play-stage>.q-head,.play-stage>.flip,.play-stage>.card{width:100%}
.start-stage{min-height:calc(100vh - 200px)}
/* 時間線上的現存古老生物：小圖示貼近中線，只是提示 */
.tl-marker{position:relative;width:calc(50% - 22px);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.tl-marker.left{margin-right:auto;flex-direction:row-reverse;text-align:right}
.tl-marker.right{margin-left:auto;text-align:left}
.tl-marker .fossil{height:40px;width:auto;max-width:64px;flex:none}
.tl-marker .lbl{display:flex;flex-direction:column;line-height:1.25}
.tl-marker b{font-size:13px}
.tl-marker i{font-size:11px;color:var(--text-muted);font-weight:400}
.tl-marker::after{content:"";position:absolute;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:var(--era-c);opacity:.8}
.tl-marker.left::after{right:-28px} .tl-marker.right::after{left:-28px}
/* 冷知識挑戰：翻面後依對錯變色 */
#flip .face-back.res-ok{--glow-c:var(--acid);background:color-mix(in srgb,var(--acid) 14%,var(--card))}
#flip .face-back.res-no{--glow-c:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--card))}
#flip .face-back.res-ok .res-title{color:var(--ink-ok)} #flip .face-back.res-no .res-title{color:var(--ink-red)}
#flip.shake{animation:shake .5s ease}
@media (prefers-reduced-motion: reduce){#flip.shake{animation:none}}
/* 生圖挑戰：一題三張圖 */
.img-title{text-align:center;margin:18px 0 6px}
#sec-image .verdict-line{text-align:center}
.img-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:12px 0 18px;align-items:start}
.img-choice{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);color:var(--text);border:2px solid var(--border);border-radius:0;padding:10px;font:inherit;text-align:center;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.img-choice:hover:not(:disabled){border-color:color-mix(in srgb,var(--acid) 60%,transparent)}
.img-choice img{width:100%;display:block}
.img-choice .badge{position:absolute;top:16px;left:16px;background:var(--bg-deep);color:var(--text);font-weight:700;padding:2px 10px;border:1px solid var(--border)}
.img-choice.is-correct{border-color:var(--acid);background:color-mix(in srgb,var(--acid) 14%,var(--card));box-shadow:0 0 14px color-mix(in srgb,var(--acid) 55%,transparent)}
.img-choice.is-picked,.img-choice.is-wrong{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 12%,var(--card));box-shadow:0 0 12px color-mix(in srgb,var(--pink) 45%,transparent)}
.img-choice.is-picked{box-shadow:0 0 18px color-mix(in srgb,var(--pink) 70%,transparent)}

.img-choice:disabled{cursor:default}
.img-choice .mark{font-size:44px;font-weight:700;line-height:1}
.img-choice .mark.ok{color:var(--ink-ok)} .img-choice .mark.bad{color:var(--ink-pink)}
.img-next{min-height:48px}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px) rotate(-1deg)}30%{transform:translateX(8px) rotate(1deg)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(2px)}}
.img-choice.shake{animation:shake .5s ease}
@media (prefers-reduced-motion: reduce){.img-choice.shake{animation:none}}
.img-choice .err-list{margin:0;padding:0;list-style:none;font-size:14px;color:var(--text)}
.img-choice .err-list li::before{content:"✗ ";color:var(--ink-pink)}
.img-choice .exp{font-size:13px;color:var(--text-muted);line-height:1.6}
/* 可展開的大滅絕事件 */
.event-more{position:relative;z-index:1;margin:6px 0 26px}
.event-more>summary{list-style:none;cursor:pointer;margin:0;flex-wrap:wrap}
.event-more>summary::-webkit-details-marker{display:none}
.event-more .toggle-txt{color:var(--wrong);font-size:13px}
.event-more>summary:hover .txt{box-shadow:0 0 10px rgba(255,255,255,.35)}
.ev-body{max-width:560px;margin:12px auto 0;background:var(--card);border:1.5px solid rgba(255,255,255,.7);box-shadow:0 0 10px rgba(255,255,255,.25);padding:18px 22px;text-align:center}
.ev-body h4{margin:4px 0 6px;font-size:20px}
.ev-body p{font-size:15px;line-height:1.75}
.ev-body .evi-title{margin:14px 0 8px;font-size:15px;color:var(--wrong)}
.ev-body .evi{background:rgba(255,255,255,.06);padding:8px 12px;margin:0 0 6px;font-size:14px;line-height:1.6}
.ev-body .evi b{display:block;font-size:15px}
.ev-body .closing{margin-top:12px;font-weight:700}
.ev-body .small{font-size:12px;color:var(--text-muted)}
/* 卡片螢光：外層卡片發光，卡片內的卡片與按鈕不發光 */
:root{--glow-c:#FFD400}
.card,.menu-card,.review-item,.node details,.cert{--glow-b:1.5px solid color-mix(in srgb,var(--glow-c) 70%,transparent);
  --glow:0 0 10px color-mix(in srgb,var(--glow-c) 35%,transparent),0 0 22px color-mix(in srgb,var(--glow-c) 12%,transparent)}
.card,.menu-card,.review-item,.node details{border:var(--glow-b);box-shadow:var(--glow)}
/* 三色分配：工程黃為主，酸性綠、翡翠綠為輔 */
.menu-card:nth-child(2),#sec-quiz .mode-card:nth-child(2),.trivia-col.true,#sec-image,#sec-about .card:nth-child(3n+2){--glow-c:var(--acid)}
.menu-card:nth-child(3),#sec-quiz .mode-card.full,.trivia-col.false,#comparator,#sec-about .card:nth-child(3n){--glow-c:var(--emerald)}
.menu-card .ic,.menu-card .arrow{color:var(--glow-c)} .menu-card::before{background:var(--glow-c)}
.trivia-col h3{color:var(--glow-c)!important}
#sec-image .opt:has(input:checked){border-color:var(--acid)} #sec-image .opt input{accent-color:var(--acid)}
#comparator .btn-accent{background:var(--emerald);border-color:var(--emerald)}
#comparator .btn-accent:hover{background:#3BE6A9}

.review-item{border-left:5px solid var(--wrong)}
.cert{border:4px double var(--glow-c);box-shadow:var(--glow)}
.menu-card:hover{box-shadow:0 0 14px color-mix(in srgb,var(--glow-c) 55%,transparent),0 0 30px color-mix(in srgb,var(--glow-c) 20%,transparent)}
.card .card,.card .menu-card,.card .review-item,.cert .card,.card .cert{border:1px solid var(--border);box-shadow:none}
.card .btn,.card .opt,.card .stat,.cert .btn,.node details .btn{box-shadow:none}

/* 系統為淺色模式時：白色背景、深色文字（深色模式維持上方的黑色配色） */
@media (prefers-color-scheme: light){
  :root{--bg:#FFFFFF; --bg-deep:#F3F3F3; --card:#FFFFFF; --card-2:#F7F7F7;
    --beige:#111111; --text:#111111; --text-muted:#5E5E5E; --border:rgba(0,0,0,.14);
    --correct:#3E7D00; --wrong:#111111; --gray-tag:#8A8A8A; --dark-era:#C8C8C8; --dark-era-text:#8A8A8A; --panel:#F5F5F5;
    --ink-y:#8A6D00; --ink-acid:#3E7D00; --ink-emerald:#00875A; --ink-pink:#C4148C; --ink-ok:#3E7D00; --ink-red:#C8102E}
  .nav{background:rgba(255,255,255,.95)}
  .track{background:#CFCFCF}
  .btn-primary:hover{background:#333}
  .btn-secondary:hover{background:rgba(0,0,0,.05)}
  .btn:disabled{background:#E2E2E2;color:#9A9A9A;border-color:#E2E2E2}
  .progress,.bar-track{background:rgba(0,0,0,.1)}
  .cmp-bar{background:rgba(0,0,0,.06)}
  .node summary:hover{background:rgba(0,0,0,.03)}
  .era-dark .node details{background:#FFFFFF}
  a,.nav-link:hover,.back:hover,.toggle-txt,.mark.miss,.arch-box.ai,.jp .jp-head b,.day-fact .hl,.dino-era-banner{color:var(--ink-y)}
  .meso-tag,.ev.neon{color:var(--ink-acid)}
  .trivia-col.true h3{color:var(--ink-acid)!important} .trivia-col.false h3{color:var(--ink-emerald)!important}
  .menu-card:nth-child(1) .arrow,.menu-card:nth-child(4) .arrow{color:var(--ink-y)}
  .menu-card:nth-child(2) .arrow{color:var(--ink-acid)} .menu-card:nth-child(3) .arrow{color:var(--ink-emerald)}
  .gtag{color:#111} .g-sauro{color:#FFFFFF} .g-early,.g-bird{background:#E6E6E6}
  .jp{color:#222} .jp pre{color:#333} .jp details{border-top-color:rgba(0,0,0,.12)}
  .event-more>summary:hover .txt{box-shadow:0 0 10px rgba(0,0,0,.2)}
  .ev-body{border-color:rgba(0,0,0,.55);box-shadow:0 0 10px rgba(0,0,0,.12)}
  .ev-body .evi{background:rgba(0,0,0,.05)}
  .btn-accent,.judge-banner,.face .tag-ai{color:#111}
  .remain{color:var(--ink-y)}
  .fossil{filter:brightness(.8) drop-shadow(0 0 2px currentColor) drop-shadow(0 0 8px color-mix(in srgb,currentColor 45%,transparent))}
  .deco-fern,.deco-amm{opacity:.95} .deco-s{opacity:1}
}
@media (max-width:768px){
  h1{font-size:28px} h2{font-size:22px}
  .wrap{padding:0 16px}
  .card{padding:18px}
  .nav{gap:8px;padding:0 10px}
  .brand{font-size:18px}
  .brand .ic{width:24px;height:24px}
  .nav-links{justify-content:flex-start}
  .nav-link{padding:6px 8px;font-size:14px}
  .judge-switch .lbl{font-size:12px;max-width:56px;white-space:normal;line-height:1.2}
  .home{grid-template-columns:1fr;gap:28px;min-height:0}
  .deco-fern{width:180px;height:180px;opacity:.6}
  .deco-s{display:none}
  .deco-s.s1,.deco-s.s2{display:block;opacity:.55}
  .deco-amm{opacity:.6}
  .deco-amm.tr{width:130px;height:130px;right:-50px}
  .deco-amm.bl{width:120px;height:120px;left:-40px}
  .modes{grid-template-columns:1fr}
  .statement{font-size:21px}
  .trivia-cols{grid-template-columns:1fr}
  .img-play{grid-template-columns:1fr}
  .img-choices{grid-template-columns:1fr}
  .play-stage{min-height:0}
  .event-more>summary{justify-content:flex-start}
  .btn-row{flex-direction:column;align-items:stretch}
  .ev{font-size:12px}
  .era::before{left:14px}
  .era-head{margin-left:34px}
  .event{justify-content:flex-start;margin-left:6px}
  .node,.tl-marker{width:auto;margin-left:40px!important;margin-right:0!important}
  .tl-marker{flex-direction:row!important;text-align:left!important}
  .tl-marker::after{left:-30px!important;right:auto!important}
  .node.left::after,.node.right::after{left:-33px;right:auto}
  .cmp-form{grid-template-columns:1fr}
  .bar-row{grid-template-columns:90px 1fr 70px}
  .menu-card .arrow{display:none}
}
</style>

e_zh": "三角龍", "name_sci": "Triceratops", "era_section": "白堊紀", "group": "鳥臀類", "is_dinosaur": true, "start_mya": 68, "end_mya": 66, "length": "", "diet": "", "fossil_location": "", "intro": "", "fun_fact": "", "image": "assets/images/species_triceratops.webp", "sources": [], "in_comparator": true, "ai_log": null}, {"id": "tyrannosaurus", "name_zh": "暴龍", "name_sci": "Tyrannosaurus rex", "era_section": "白堊紀", "group": "獸腳類", "is_dinosaur": true, "start_mya": 68, "end_mya": 66, "length": "約 12 公尺", "diet": "肉食", "fossil_location": "北美洲西部", "intro": "暴龍是白堊紀最末期的大型肉食性恐龍，也是已知最大的陸生肉食動物之一。牠的頭骨長可達約 1.5 公尺，咬合力在陸生動物中名列前茅。暴龍的前肢很短，只有兩根有功能的手指，但肌肉相當發達。暴龍在 1905 年被命名，學名的意思是「暴君蜥蜴之王」。牠和三角龍生活在同一時代、同一地區。", "fun_fact": "暴龍和劍龍相隔的時間，比暴龍和人類相隔的時間還要久。", "image": "assets/images/species_tyrannosaurus.webp", "sources": [{"title": "維基百科：暴龍屬", "url": "https://zh.wikipedia.org/wiki/暴龍屬"}], "in_comparator": true, "ai_log": {"intro_sources": ["doc_001"], "image_prompt": "tyrannosaurus rex with horizontal posture, tail held off the ground, lips covering teeth, late Cretaceous forest", "negative_prompt": "upright posture, tail dragging, grass field", "seed": 90133, "anachronism_check": {"passed": false, "issues": ["第一版 prompt 寫了 grassland，但草原要到更晚才普遍，已改為白堊紀晚期森林"]}}}, {"id": "ammonite", "name_zh": "菊石", "name_sci": "Ammonoidea", "era_section": "白堊紀", "group": "頭足類", "is_dinosaur": false, "start_mya": 409, "end_mya": 66, "length": "", "diet": "", "fossil_location": "", "intro": "", "fun_fact": "", "image": "assets/images/species_ammonite.webp", "sources": [], "in_comparator": true, "ai_log": null, "timeline_position_mya": 67}, {"id": "modern_birds", "name_zh": "現代鳥類", "name_sci": "Neornithes", "era_section": "大滅絕之後", "group": "鳥類", "is_dinosaur": true, "start_mya": 66, "end_mya": 0, "length": "", "diet": "", "fossil_location": "", "intro": "6,600 萬年前的大滅絕消滅了所有非鳥類恐龍，但有一支會飛的小型恐龍活了下來，演化成今天的一萬多種鳥類。從麻雀到雞，鳥類在分類上都屬於恐龍，所以恐龍其實沒有完全滅絕。", "fun_fact": "雞和暴龍的親緣關係，比暴龍和劍龍還要近。", "image": "assets/images/species_modern_birds.webp", "sources": [{"title": "維基百科：恐龍", "url": "https://zh.wikipedia.org/wiki/恐龍"}], "in_comparator": false, "ai_log": null}, {"id": "nautilus", "name_zh": "鸚鵡螺", "name_sci": "Nautilus", "era_section": "古生代", "group": "頭足類", "is_dinosaur": false, "start_mya": 500, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}, {"id": "horseshoe_crab", "name_zh": "鱟", "name_sci": "Xiphosura", "era_section": "古生代", "group": "節肢動物", "is_dinosaur": false, "start_mya": 445, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}, {"id": "shark", "name_zh": "鯊魚", "name_sci": "Selachimorpha", "era_section": "古生代", "group": "軟骨魚類", "is_dinosaur": false, "start_mya": 420, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}, {"id": "coelacanth", "name_zh": "腔棘魚", "name_sci": "Latimeria", "era_section": "古生代", "group": "肉鰭魚類", "is_dinosaur": false, "start_mya": 410, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}, {"id": "fern", "name_zh": "蕨類", "name_sci": "Polypodiopsida", "era_section": "古生代", "group": "蕨類植物", "is_dinosaur": false, "start_mya": 360, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}, {"id": "dragonfly", "name_zh": "蜻蜓", "name_sci": "Odonata", "era_section": "古生代", "group": "昆蟲", "is_dinosaur": false, "start_mya": 325, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}, {"id": "cockroach", "name_zh": "蟑螂", "name_sci": "Blattodea", "era_section": "古生代", "group": "昆蟲", "is_dinosaur": false, "start_mya": 320, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}, {"id": "ginkgo", "name_zh": "銀杏", "name_sci": "Ginkgo biloba", "era_section": "古生代", "group": "裸子植物", "is_dinosaur": false, "start_mya": 270, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}, {"id": "platypus", "name_zh": "鴨嘴獸", "name_sci": "Ornithorhynchus anatinus", "era_section": "白堊紀", "group": "哺乳類", "is_dinosaur": false, "start_mya": 110, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}, {"id": "mosquito", "name_zh": "蚊子", "name_sci": "Culicidae", "era_section": "白堊紀", "group": "昆蟲", "is_dinosaur": false, "start_mya": 99, "end_mya": 0, "display": "marker", "in_comparator": false, "sources": []}], "overview": [{"mya": 4600, "label": "地球形成"}, {"mya": 539, "label": "寒武紀大爆發"}, {"mya": 252, "label": "二疊紀末大滅絕"}, {"mya": 230, "label": "恐龍出現"}, {"mya": 66, "label": "白堊紀末大滅絕"}, {"mya": 0.3, "label": "人類出現"}], "comparisons": {"stegosaurus__tyrannosaurus": {"text": "劍龍在侏羅紀晚期就已經消失，暴龍要到七千多萬年後的白堊紀末才出現。電影把牠們放在一起，但牠們從來沒有見過面。", "ai_log": {"sources": ["doc_003", "doc_001"], "raw_output": "劍龍在侏羅紀晚期就已經消失，暴龍要到七千多萬年後的白堊紀末才出現……"}}, "mosasaurus__tyrannosaurus": {"text": "滄龍和暴龍都生活在白堊紀最末期，只是一個在海裡、一個在陸地上。牠們最後在同一次大滅絕中一起消失。", "ai_log": {"sources": ["doc_mosasaurus", "doc_001"], "raw_output": "滄龍和暴龍都生活在白堊紀最末期……"}}, "mosasaurus__stegosaurus": {"text": "劍龍消失之後又過了六千多萬年，滄龍才出現在白堊紀晚期的海洋中。一個是陸上的植食恐龍，一個是海裡的掠食性爬行動物。", "ai_log": {"sources": ["doc_mosasaurus", "doc_003"], "raw_output": "劍龍消失之後又過了六千多萬年……"}}, "trilobite__tyrannosaurus": {"text": "三葉蟲在二疊紀末大滅絕時就已經消失，比暴龍出現早了將近兩億年。對暴龍來說，三葉蟲就像我們眼中的恐龍一樣古老。", "ai_log": {"sources": ["doc_trilobite", "doc_001"], "raw_output": "三葉蟲在二疊紀末大滅絕時就已經消失……"}}, "stegosaurus__trilobite": {"text": "三葉蟲滅絕後大約一億年，劍龍才出現。牠們分別屬於恐龍出現之前和恐龍最繁盛的兩個時代。", "ai_log": {"sources": ["doc_trilobite", "doc_003"], "raw_output": "三葉蟲滅絕後大約一億年……"}}, "mosasaurus__trilobite": {"text": "兩者都生活在海洋中，卻相隔了一億多年。三葉蟲爬行在古生代的海底，滄龍則稱霸白堊紀的海洋。", "ai_log": {"sources": ["doc_trilobite", "doc_mosasaurus"], "raw_output": "兩者都生活在海洋中，卻相隔了一億多年……"}}}, "about": {"goal": "「恐龍偵探！」把恐龍冷知識、AI 生圖辨識和恐龍演化時間線做成互動網站，同時展示生成式 AI 在出題、審題與生圖中如何被使用，以及它可能犯哪些錯。", "evaluation": {"question_pass_rate": null, "llm_only_accuracy": null, "llm_rag_accuracy": null, "reviewer_rejected": null, "reviewer_total": null, "anachronism_blocked": null, "test_items": []}, "sources": [{"name": "維基百科（中文）", "url": "https://zh.wikipedia.org/", "license": "CC BY-SA 4.0"}, {"name": "倫敦自然史博物館 Dino Directory", "url": "https://www.nhm.ac.uk/discover/dino-directory.html", "license": "引用連結，內容版權屬原網站"}], "ai_assistance": "冷知識題目由出題 agent 生成、審題 agent 檢查，並經人工確認；恐龍圖片由文字生圖模型生成並經人工挑選；網站程式與部分資料整理由 Claude 協助完成。"}, "era_notes": {"古生代": {"title": "生命登上舞台", "lead": "古生代從約 5.4 億年前開始，長達將近 3 億年。這段時間裡，動物從海洋中大量出現，植物和動物先後登上陸地，許多後來的動物家族都在這時打下基礎。", "points_title": "這段時間發生了什麼？", "points": [{"name": "寒武紀大爆發", "text": "約 5.4 億年前，海洋中在短時間內出現了大多數的動物類群，三葉蟲就是這時候的代表。"}, {"name": "生物登上陸地", "text": "植物最先在陸地上扎根，接著節肢動物跟上，陸地開始有了生態系。"}, {"name": "魚類時代與四足動物", "text": "泥盆紀被稱為「魚類時代」，其中一群魚的鰭演化成四肢，成為最早的四足動物。"}, {"name": "巨大的森林", "text": "石炭紀有大片高大的森林，後來變成今天的煤礦；當時空氣中氧氣很多，出現翼展約 70 公分的巨型昆蟲。"}, {"name": "盤古大陸", "text": "到了二疊紀，各大陸合併成一塊超級大陸，異齒龍這類合弓類動物在陸地上繁盛。"}], "closing": "古生代在一場大滅絕中結束，那也是地球史上最嚴重的一次。", "sources": [{"title": "維基百科：古生代", "url": "https://zh.wikipedia.org/wiki/古生代"}, {"title": "維基百科：寒武紀大爆發", "url": "https://zh.wikipedia.org/wiki/寒武紀大爆發"}]}, "二疊紀末大滅絕": {"title": "地球史上最嚴重的大滅絕", "lead": "約 2.52 億年前，地球上大約九成以上的海洋物種、約七成的陸地脊椎動物物種消失，生態系花了數百萬年才恢復。", "points_title": "發生了什麼？", "points": [{"name": "西伯利亞火山噴發", "text": "今天西伯利亞一帶發生長時間的大規模火山噴發，釋放出大量二氧化碳等氣體。"}, {"name": "全球暖化", "text": "大量溫室氣體讓地球快速變熱。"}, {"name": "海洋酸化與缺氧", "text": "海水變酸、氧氣減少，海洋生物受到最嚴重的打擊。"}, {"name": "三葉蟲消失", "text": "在海洋中繁盛了將近 3 億年的三葉蟲，在這次滅絕中完全消失。"}], "closing": "倖存的動物中有一群爬行動物叫做主龍類，牠們後來演化出恐龍、翼龍和鱷魚。", "sources": [{"title": "維基百科：二疊紀-三疊紀滅絕事件", "url": "https://zh.wikipedia.org/wiki/二疊紀-三疊紀滅絕事件"}, {"title": "維基百科：西伯利亞暗色岩", "url": "https://zh.wikipedia.org/wiki/西伯利亞暗色岩"}]}, "三疊紀": {"title": "恐龍登場", "lead": "大滅絕之後，空出來的生存空間讓許多新動物出現。第一批恐龍大約在 2.3 億年前登場，牠們體型不大，用兩隻後腳走路。", "points_title": "三疊紀的世界", "points": [{"name": "炎熱的超級大陸", "text": "各大陸仍連成盤古大陸，氣候炎熱，內陸有大片沙漠。"}, {"name": "恐龍還不是主角", "text": "當時陸地上最強勢的是鱷魚的遠親，早期的恐龍只是眾多爬行動物中的一員。"}, {"name": "其他新面孔", "text": "翼龍飛上天空，海中有魚龍，最早的哺乳類祖先也在三疊紀晚期出現。"}], "closing": "三疊紀末又發生一次大滅絕，許多鱷魚的遠親消失，恐龍才真正成為陸地的霸主。", "sources": [{"title": "維基百科：三疊紀", "url": "https://zh.wikipedia.org/wiki/三疊紀"}, {"title": "維基百科：三疊紀-侏羅紀滅絕事件", "url": "https://zh.wikipedia.org/wiki/三疊紀-侏羅紀滅絕事件"}]}, "侏羅紀": {"title": "巨人的時代", "lead": "盤古大陸開始分裂，氣候變得溫暖潮濕，茂密的森林養活了體型巨大的植食性恐龍。", "points_title": "侏羅紀的世界", "points": [{"name": "大陸分裂", "text": "盤古大陸分成北邊和南邊兩塊大陸，大西洋開始形成。"}, {"name": "還沒有花的森林", "text": "森林由蕨類、蘇鐵和針葉樹組成，這時候還沒有開花植物。"}, {"name": "巨型蜥腳類", "text": "腕龍等巨型蜥腳類稱霸陸地，劍龍和異特龍也生活在侏羅紀晚期。"}, {"name": "鳥類的祖先", "text": "約 1.5 億年前的始祖鳥同時有羽毛、牙齒和長尾巴，是恐龍和鳥類之間的重要化石。"}], "closing": "電影《侏羅紀公園》裡的暴龍和迅猛龍，其實都生活在下一個時代：白堊紀。", "sources": [{"title": "維基百科：侏羅紀", "url": "https://zh.wikipedia.org/wiki/侏羅紀"}, {"title": "維基百科：始祖鳥屬", "url": "https://zh.wikipedia.org/wiki/始祖鳥屬"}]}, "白堊紀": {"title": "恐龍的全盛時期", "lead": "白堊紀是三個恐龍時代中最長的一段，恐龍的種類在這時候達到高峰，大陸的位置也越來越接近今天。", "points_title": "白堊紀的世界", "points": [{"name": "開花植物出現", "text": "開花植物在白堊紀出現並迅速擴散，改變了陸地上的生態。"}, {"name": "海平面很高", "text": "當時海平面比現在高很多，北美洲曾經被一條內陸海道分成東西兩半。"}, {"name": "恐龍多樣性高峰", "text": "暴龍、三角龍、迅猛龍、棘龍、厚頭龍都生活在白堊紀。"}, {"name": "天空與海洋", "text": "無齒翼龍在天空滑翔，滄龍是海洋中的頂級掠食者，菊石依然遍布海洋。"}], "closing": "暴龍和劍龍相隔的時間，比暴龍和人類相隔的時間還要久。", "sources": [{"title": "維基百科：白堊紀", "url": "https://zh.wikipedia.org/wiki/白堊紀"}]}, "白堊紀末大滅絕": {"title": "恐龍時代的終點", "lead": "約 6,600 萬年前，大約四分之三的物種消失，所有非鳥類恐龍、翼龍、滄龍和菊石都在這次滅絕中走入歷史。", "points_title": "科學家怎麼知道？", "points": [{"name": "小行星撞擊", "text": "一顆直徑約 10 公里的小行星撞上今天墨西哥的猶加敦半島，留下直徑約 180 公里的希克蘇魯伯隕石坑。"}, {"name": "地層裡的銥", "text": "世界各地這個年代的地層中都有一層含銥量特別高的黏土，銥在地殼中很少，在小行星中卻比較多。"}, {"name": "撞擊後的黑暗", "text": "撞擊揚起的塵埃和煙霧遮住陽光，植物無法行光合作用，整個食物鏈跟著崩潰。"}, {"name": "火山也來湊熱鬧", "text": "同一時期印度的德干高原也有大規模火山噴發，可能讓環境變得更惡劣。"}], "closing": "體型小、能吃種子或躲進洞穴的動物比較容易撐過去，這可能是鳥類祖先和小型哺乳類活下來的原因之一。", "sources": [{"title": "維基百科：白堊紀-古近紀滅絕事件", "url": "https://zh.wikipedia.org/wiki/白堊紀-古近紀滅絕事件"}, {"title": "維基百科：希克蘇魯伯隕石坑", "url": "https://zh.wikipedia.org/wiki/希克蘇魯伯隕石坑"}]}, "大滅絕之後": {"title": "麻雀也是恐龍", "lead": "在生物分類上，鳥類屬於恐龍裡的獸腳類，和暴龍、迅猛龍是同一個大家族。6,600 萬年前的大滅絕消滅了所有「非鳥類恐龍」，但有一支小型、長著羽毛的恐龍活了下來，演化成今天的一萬多種鳥類。窗外跳來跳去的麻雀，就是活著的恐龍。", "points_title": "科學家怎麼知道？", "points": [{"name": "羽毛", "text": "中華龍鳥等許多非鳥類恐龍的化石上保存了羽毛痕跡，羽毛並不是鳥類才有。"}, {"name": "叉骨", "text": "雞身上 V 字形的叉骨（許願骨），在暴龍、迅猛龍等獸腳類恐龍身上也找得到。"}, {"name": "中空的骨頭", "text": "獸腳類恐龍和鳥類一樣，骨頭裡有和氣囊相連的空腔，讓身體更輕。"}, {"name": "孵蛋的姿勢", "text": "蒙古出土的竊蛋龍類化石，以和鳥類相同的姿勢趴在巢上，前肢圍住蛋。"}, {"name": "三趾的腳", "text": "牠們都用三根向前的腳趾著地走路，小型獸腳類的足跡和鳥類腳印非常相似。"}], "closing": "所以「恐龍滅絕了」這句話並不完全正確，更精確的說法是：非鳥類恐龍滅絕了，鳥類恐龍到今天都還在。", "sources": [{"title": "維基百科：鳥類起源", "url": "https://zh.wikipedia.org/wiki/鳥類起源"}, {"title": "維基百科：恐龍", "url": "https://zh.wikipedia.org/wiki/恐龍"}]}}, "live_sim": [{"doc_id": "doc_001", "question": {"statement": "暴龍的前肢只有兩根有功能的手指。", "answer": true, "explanation": "暴龍的前肢雖短，但只有兩根有功能的手指，而且肌肉發達。", "quote": "只有兩根有功能的手指", "source_doc_id": "doc_001"}, "attempts": [{"gen": {"output": {"statement": "暴龍的前肢只有兩根有功能的手指。", "answer": true, "explanation": "暴龍的前肢雖短，但只有兩根有功能的手指，而且肌肉發達。", "quote": "只有兩根有功能的手指", "source_doc_id": "doc_001"}, "ms": 2140, "tokens": 812}, "review": {"output": {"verdict": "pass", "reasons": ["answer 與資料一致", "quote 確實出現在資料中", "敘述通順"], "checks": {"answer_correct": true, "quote_found": true, "unambiguous": true, "readable": true}}, "ms": 1630, "tokens": 905}}], "result": "通過"}, {"doc_id": "doc_002", "question": {"statement": "迅猛龍的化石主要發現於北美洲。", "answer": false, "explanation": "迅猛龍的化石主要發現於蒙古，不是北美洲。", "quote": "化石主要發現於蒙古", "source_doc_id": "doc_002"}, "attempts": [{"gen": {"output": {"statement": "迅猛龍的牙齒帶有毒液。", "answer": false, "explanation": "迅猛龍沒有毒牙。", "quote": "", "source_doc_id": "doc_002"}, "ms": 1980, "tokens": 790}, "review": {"output": {"verdict": "fail", "reasons": ["資料沒有提到牙齒或毒液，這題屬於「資料未涵蓋」而不是「與資料矛盾」", "quote 為空，找不到依據"], "checks": {"answer_correct": false, "quote_found": false, "unambiguous": false, "readable": true}}, "ms": 1510, "tokens": 870}}, {"gen": {"output": {"statement": "迅猛龍的化石主要發現於北美洲。", "answer": false, "explanation": "迅猛龍的化石主要發現於蒙古，不是北美洲。", "quote": "化石主要發現於蒙古", "source_doc_id": "doc_002"}, "ms": 2050, "tokens": 846}, "review": {"output": {"verdict": "pass", "reasons": ["假題改變了資料中的地點，錯誤明確", "quote 出現在資料中 const LIVE_TEXTS = ["偵探正在翻閱化石紀錄……", "正在出題……", "偵探審題中……"];

/* ---------- placeholders ---------- */
function placeholder(name, w = 800, h = 560, sub = "AI 圖片待放入") {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <rect width="100%" height="100%" fill="#1E1E1E"/><rect x="12" y="12" width="${w-24}" height="${h-24}" rx="14" fill="none" stroke="#FFD400" stroke-opacity=".45" stroke-width="3" stroke-dasharray="10 8"/>

/* ---------- loader ---------- */
let loaderTimer = null;
function loaderHTML(texts) {
  clearInterval(loaderTimer);
  let i = 0;
  setTimeout(() => {
    loaderTimer = setInterval(() => { const el = $("#loaderText"); if (!el) { clearInterval(loaderTimer); return; } i = (i + 1) % texts.length; el.textContent = texts[i]; }, 1500);
  }, 0);
  return `<div class="loader">${ic("ammonite")}<div id="loaderText">${esc(texts[0])}</div></div>`;
}

/* ---------- navigation ---------- */
function go(name) {
  S.section = name;
  document.querySelectorAll(".section").forEach(s => s.classList.toggle("active", s.id === "sec-" + name));
  document.querySelectorAll(".nav-link").forEach(b => b.classList.toggle("active", b.dataset.go === name));
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");

$("#judgeToggle").addEventListener("change", e => {

/* ---------- judge helpers ---------- */
const pj = o => esc(JSON.stringify(o, null, 2));
function jpWrap(steps) {
  return `<div class="jp-head"><b>AI 運作過程</b><span>顯示每一步的輸入、輸出與 AI 被要求寫出的判斷理由，不是模型的內部思考。</span></div>` + steps;
}
function step(n, name, body, meta = "", open = false) {
  return `<details ${open ? "open" : ""}><summary><span>步驟 ${n}：${esc(name)}</span><span class="meta">${esc(meta)}</span></summary><pre>${body}</pre></details>`;
}
function archHTML() {
  const row = items => `<div class="arch-row">${items.map((t, i) => (i ? `<span class="arch-arrow">→</span>` : "") + `<span class="arch-box ${t[1] ? "ai" : ""}">${esc(t[0])}</span>`).join("")}</div>`;
  return `<div class="arch">
    ${row([["恐龍資料", 0], ["出題 agent", 1], ["審題 agent", 1], ["人工檢查", 0], ["題庫", 0]])}
    ${row([["文字生圖模型", 1], ["人工挑選", 0], ["圖庫", 0]])}
    ${row([["恐龍資料", 0], ["時間線介紹與插圖 prompt", 1], ["時代錯置檢查", 1], ["時間線", 0]])}

}

/* ---------- formatting ---------- */
function fmtMya(m) {
  if (m >= 100) return (Math.round(m) / 100).toFixed(2).replace(/\.?0+$/, "") + " 億";
  return Math.round(m * 100).toLocaleString("en-US") + " 萬";
}
function fmtRange(sp) {
  if (sp.end_mya === 0) return `${fmtMya(sp.start_mya)}年前至今`;
  if (sp.start_mya === sp.end_mya) return `約 ${fmtMya(sp.start_mya)}年前`;
  return `約 ${fmtMya(sp.start_mya)}至 ${fmtMya(sp.end_mya)}年前`;
}
function fmtSpan(m) { return m >= 100 ? `${(m / 100).toFixed(2)} 億年` : `${Math.round(m * 100).toLocaleString("en-US")} 萬年`; }

const GENERAL_N = 10;
function quizTitle(mode, s) {
  if (mode === "general") return s <= 3 ? "化石挖掘新手" : s <= 7 ? "恐龍偵探……的徒弟" : "恐龍偵探！";
  return s <= 3 ? "恐龍知識小白" : "恐龍偵探！";
}
function renderQuiz() {
  const q = S.quiz, el = $("#quizBody");
  if (q.screen === "mode") return el.innerHTML = quizModeHTML();
  if (q.screen === "trivia") return el.innerHTML = triviaHTML();
  if (q.screen === "result") return el.innerHTML = quizResultHTML();
  el.innerHTML = quizPlayHTML();
}
function quizModeHTML() {
  const q = S.quiz;
  const out = q.livePlaysLeft <= 0, quota = q.quotaExceeded;
  const liveDisabled = out || quota;
  let liveDesc = "由 AI 當場根據恐龍資料出題，每一題都是新的。每位玩家限 5 題，每題約需 10 秒。";
  if (quota) liveDesc = "AI 即時出題今天的額度已經用完，請先挑戰一般模式。";
  return `
  <div class="section-head">${ic("ammonite")}<h2>恐龍冷知識大挑戰</h2></div>
  <div class="play-stage start-stage"><p class="lead">每一題都是一則恐龍冷知識，請判斷它們是真是假？</p>
  <div class="modes">
    <div class="card mode-card">
      <h3>一般模式</h3>
      <p>從經過人工檢查的題庫中隨機抽 10 題。</p>
      <button class="btn btn-primary" onclick="startGeneral()">開始挑戰</button>
    </div>
    <div class="card mode-card">
      ${quota ? `<span class="quota-tag">今日額度已達上限</span>` : ""}
      <h3>AI 即時模式</h3>
      <p>${liveDesc}</p>
      ${quota ? "" : `<div class="remain">${out ? "你的即時題數已用完，請改玩一般模式" : `你還可以玩 ${q.livePlaysLeft} 題`}</div>`}
      <button class="btn btn-accent" ${liveDisabled ? "disabled" : ""} onclick="startLive()">開始即時挑戰</button>
    </div>
    <div class="card mode-card full">
      <div><h3>冷知識總覽</h3><p>不想答題？直接翻開所有冷知識卡片。</p></div>
      <button class="btn btn-secondary" onclick="openTrivia()">查看所有冷知識</button>
    </div>
  </div></div>`;
}
function startGeneral() {
  const q = S.quiz;
  Object.assign(q, { screen: "play", mode: "general", list: shuffle(D.question_bank).slice(0, GENERAL_N), idx: 0, score: 0, streak: 0, answered: false, results: [], loading: false });
  q.total = q.list.length;
  renderQuiz();
}
function startLive() {
  const q = S.quiz;
  if (q.livePlaysLeft <= 0 || q.quotaExceeded) return;
  Object.assign(q, { screen: "play", mode: "live", list: [], idx: 0, score: 0, streak: 0, answered: false, results: [], logs: [] });
  q.total = Math.min(5, q.livePlaysLeft);
  loadLive();
}
function loadLive() {
  const q = S.quiz;
  q.loading = true; q.answered = false;
  renderQuiz();
  setTimeout(() => {
    const sim = D.live_sim[q.liveCursor % D.live_sim.length]; q.liveCursor++;
    const doc = D.live_docs.find(d => d.id === sim.doc_id);
    q.list[q.idx] = Object.assign({}, sim.question, { source: doc.source, live: true });
    q.logs[q.idx] = { sim, doc };
    q.livePlaysLeft--;
    q.loading = false;
    renderQuiz();
  }, 4200);
}
function quizPlayHTML() {
  const q = S.quiz;
  const pct = (q.idx / q.total) * 100;
  const head = `
  <button class="back" onclick="S.quiz.screen='mode';S.quiz.loading=false;renderQuiz()">← 返回挑戰選單</button>
  <div class="section-head">${ic("ammonite")}<h2>恐龍冷知識大挑戰</h2></div>
  <div class="play-stage"><div class="q-head">
    <span class="prog-text">第 ${q.idx + 1} / ${q.total} 題</span>
    <span class="stats"><span>得分 <b>${q.score}</b></span><span>連續答對 <b>${q.streak}</b></span></span>
    <div class="progress"><i style="width:${pct}%"></i></div>
  </div>`;
  if (q.loading) return head + `<div class="card" style="max-width:640px;margin:0 auto">${loaderHTML(LIVE_TEXTS)}</div></div>`;
  const item = q.list[q.idx];
  return head + `
  <div class="flip" id="flip">
    <div class="flip-inner">
      <div class="card face face-front">
        ${item.live ? `<span class="tag-ai">AI 即時出題</span>` : ""}
        <div class="statement">${esc(item.statement)}</div>
        <div class="tf"><button class="t" onclick="answer(true)">真的</button><button class="f" onclick="answer(false)">假的</button></div>
      </div>
      <div class="card face face-back" id="back"></div>
    </div>
  </div></div>
  <div class="jp" style="max-width:640px;margin:20px auto">${quizJudgeHTML()}</div>`;
}
function quizJudgeHTML() {
  const q = S.quiz;
  if (q.mode === "general") {
    const g = q.list[q.idx].generation_log;
    let s = step(1, "使用的資料段落", esc(`[${g.source_doc_id}] ${g.source_excerpt}`), "", true);
    s += step(2, "出題 agent 的原始輸出", pj(g.draft));
    s += step(3, "審題 agent 的判定與理由", g.reviews.map((r, i) => `第 ${i + 1} 次：<span class="${r.verdict}">${r.verdict}</span>\n${esc(r.reasons.join("\n"))}`).join("\n\n"));
    s += step(4, "人工修改紀錄", esc(g.human_edit || "未修改"));
    return jpWrap(s);
  }
  const lg = q.logs[q.idx];
  if (!lg) return jpWrap(`<pre>等待 AI 出題……</pre>`);
  let n = 1;
  let s = step(n++, "選中的資料", esc(`id：${lg.doc.id}\n標題：${lg.doc.title}\n內容：${lg.doc.content}`), "", true);
  lg.sim.attempts.forEach((a, i) => {
    const tag = lg.sim.attempts.length > 1 ? `（第 ${i + 1} 次）` : "";
    s += step(n++, "出題 agent" + tag, pj(a.gen.output), `${(a.gen.ms / 1000).toFixed(1)} 秒・${a.gen.tokens} tokens`);
    s += step(n++, "審題 agent" + tag, `<span class="${a.review.output.verdict}">${a.review.output.verdict}</span>\n` + pj(a.review.output), `${(a.review.ms / 1000).toFixed(1)} 秒・${a.review.tokens} tokens`);
  });
  s += step(n, "最後結果", esc(lg.sim.result), "", true);
  return jpWrap(s);
}
function answer(choice) {
  const q = S.quiz;
  if (q.answered || q.loading) return;
  q.answered = true;
  const item = q.list[q.idx];
  const ok = choice === item.answer;
  if (ok) { q.score++; q.streak++; } else q.streak = 0;
  q.results.push({ item, ok });
  const last = q.idx + 1 >= q.total;
  $("#back").classList.add(ok ? "res-ok" : "res-no");
  $("#back").innerHTML = `
    <div class="res-title ${ok ? "ok" : "no"}">${ok ? "答對了！" : "答錯了"}</div>
    <p><b>正確答案：${item.answer ? "真的" : "假的"}</b></p>
    <p>${esc(item.explanation)}</p>
    <p class="small">資料來源：<a href="${esc(item.source.url)}" target="_blank" rel="noopener">${esc(item.source.title)}</a></p>
    <button class="btn btn-primary" onclick="nextQ()">${last ? "看成績" : "下一題"}</button>`;
  document.querySelectorAll(".q-head .stats b")[0].textContent = q.score;
  document.querySelectorAll(".q-head .stats b")[1].textContent = q.streak;
  document.querySelector(".progress > i").style.width = ((q.idx + 1) / q.total * 100) + "%";
  document.querySelectorAll(".tf button").forEach(b => b.disabled = true);
  requestAnimationFrame(() => $("#flip").classList.add("flipped"));
  if (!ok) setTimeout(() => { const f = $("#flip"); if (f) f.classList.add("shake"); }, 520);
}
function nextQ() {
  const q = S.quiz;
  q.idx++;
  if (q.idx >= q.total) { q.screen = "result"; renderQuiz(); window.scrollTo(0, 0); return; }
  q.answered = false;
  if (q.mode === "live") loadLive(); else renderQuiz();
}

  const q = S.quiz;

const IMG_N = 4;
const LETTERS = ["A", "B", "C"];
function renderImg() {

const head = t => `<div class="section-head">${ic("ammonite")}<h2>${t}</h2></div>`;
function imgStartHTML() {
  return head("AI 恐龍生圖對不對") + `
  <div class="play-stage start-stage"><div class="card" style="max-width:720px;margin:0 auto">
    <p>AI 畫恐龍時，常常會畫出過時或錯誤的樣子。每一題是一種恐龍，AI 畫了三張圖，其中只有一張符合目前的科學認識。找出畫對的那一張！一回合共 ${IMG_N} 題。</p>
    <button class="btn btn-primary" onclick="startImg()">開始挑戰</button>
  </div></div>`;
}
function startImg() {
  const s = S.img;
  s.screen = "loading"; renderImg();
  setTimeout(() => {
    const pick = shuffle(D.image_challenges).slice(0, IMG_N);
    Object.assign(s, { screen: "play", list: pick, idx: 0, score: 0, submitted: false, choice: null, results: [] });
    s.orders = pick.map(c => shuffle(c.images.map((_, i) => i)));
    renderImg();
  }, 2600);
}
function imgPick(i) {
  const s = S.img, c = s.list[s.idx];
  if (s.submitted) return;
  const ok = !!c.images[i].is_correct;
  if (ok) s.score++;
  s.results[s.idx] = { choice: i, ok };
  s.choice = i; s.submitted = true; s.justAnswered = true;
  renderImg();
  s.justAnswered = false;
}
function imgPlayHTML() {
  const s = S.img, c = s.list[s.idx], order = s.orders[s.idx];
  const total = s.list.length, done = s.submitted;
  const r = done ? s.results[s.idx] : null;
  const cards = order.map((i, pos) => {
    const im = c.images[i];
    let cls = "", mark = "", detail = "";
    if (done) {
      if (im.is_correct) { cls = "is-correct"; mark = `<span class="mark ok" aria-label="畫對了">✓</span>`; }
      else {
        cls = r.choice === i ? "is-picked" + (s.justAnswered ? " shake" : "") : "is-wrong";
        mark = `<span class="mark bad" aria-label="畫錯了">✗</span>`;
        detail = `<ul class="err-list">${im.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul><span class="exp">${esc(im.explanation)}</span>`;
      }
    }
    return `<button class="img-choice ${cls}" data-i="${i}" ${done ? "disabled" : ""} onclick="imgPick(${i})">
      <span class="badge">${LETTERS[pos]}</span>
      <img src="${placeholder(c.species + " " + LETTERS[pos], 600, 460, im.desc)}" alt="AI 生成的${esc(c.species)}圖片 ${LETTERS[pos]}">
      ${mark}${detail}</button>`;
  }).join("");
  const last = s.idx + 1 >= total;
  const steps = order.map((i, pos) => {
    const im = c.images[i], lg = im.ai_log;
    return step(pos + 1, `圖 ${LETTERS[pos]}：${im.is_correct ? "正確版本" : "刻意畫錯的版本"}`,
      pj({ 模型: lg.model, prompt: lg.prompt, negative_prompt: lg.negative_prompt || "（無）", seed: lg.seed, 刻意要畫出的錯誤: im.errors.length ? im.errors : "無" }), "", pos === 0);
  }).join("");
  return `<button class="back" onclick="S.img.screen='start';renderImg()">← 返回挑戰開始畫面</button>` + head("AI 恐龍生圖對不對") + `
  <div class="play-stage"><div class="q-head" style="max-width:none;width:100%">
    <span class="prog-text">第 ${s.idx + 1} / ${total} 題</span>
    <span class="stats"><span>得分 <b>${s.score}</b></span></span>
    <div class="progress"><i style="width:${((s.idx + (done ? 1 : 0)) / total) * 100}%"></i></div>
  </div>
  <h3 class="img-title">這三張${esc(c.species)}，哪一張畫對了？點選你的答案。</h3>

let lastCompare = null;
function doCompare() { lastCompare = [$("#cmpA").value, $("#cmpB").value]; renderCompareResult(); }
function renderCompareResult() {
  const el = $("#cmpResult");
  if (!el || !lastCompare) return;
  const [ia, ib] = lastCompare;
  if (ia === ib) { el.innerHTML = `<p style="color:var(--wrong)">請選擇兩種不同的生物</p>`; return; }
  const A = D.species.find(s => s.id === ia), B = D.species.find(s => s.id === ib);
  const max = Math.max(A.start_mya, B.start_mya);
  const P = m => (max - m) / max * 100;
  const rangeBar = (s, cls) => `<div class="cmp-range ${cls}" style="left:${P(s.start_mya)}%;width:${Math.max(P(s.end_mya) - P(s.start_mya), 0.6)}%"></div>`;
  const overlap = Math.min(A.start_mya, B.start_mya) - Math.max(A.end_mya, B.end_mya);
  let big, ratio = "";
  if (overlap >= 0) big = `牠們曾經同時生活在地球上（重疊約 ${fmtSpan(overlap)}）`;
  else {
    const gap = -overlap;
    big = `相隔約 ${fmtSpan(gap)}`;
    if (ia === "tyrannosaurus" || ib === "tyrannosaurus") ratio = `這段距離是人類出現至今（約 30 萬年）的 ${Math.round(gap / 0.3).toLocaleString("en-US")} 倍。`;

  }
  const key = [ia, ib].sort().join("__");
  const c = D.comparisons[key];
  el.innerHTML = `
    <div class="cmp-key"><span><i style="background:var(--orange)"></i>${esc(A.name_zh)}：${fmtRange(A)}</span><span><i style="background:var(--green)"></i>${esc(B.name_zh)}：${fmtRange(B)}</span></div>

    <div class="card"><h3>資料來源與授權</h3><table class="tbl"><tr><th>來源</th><th>授權</th></tr>
      ${a.sources.map(s => `<tr><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></td><td>${esc(s.license)}</td></tr>`).join("")}</table></div>
    <div class="card"><h3>AI 協助說明</h3><p style="margin:0">${esc(a.ai_assistance)}</p></div>
    <div class="card"><h3>技術棧</h3><div class="chips">${["Gradio", "AISuite", "Groq", "Hugging Face Spaces", "diffusers", "EmbeddingGemma 2", "FAISS"].map(t => `<span class="chip">${t}</span>`).join("")}</div></div>`;
  $("#jp-about").innerHTML = jpWrap(ev.test_items.length
    ? step(1, "測試題與逐題結果", pj(ev.test_items), "", true)
    : step(1, "測試題與逐題結果", "評估進行中，尚無測試題資料。", "", true));
  $("#jp-home").innerHTML = jpWrap(step(1, "整體系統架構", "", "", true).replace("<pre></pre>", archHTML()));
}

$("#homeImg").src = placeholder("迅猛龍", 840, 560, "AI 圖片待放入：全身覆羽、火雞大小");
renderQuiz(); renderImg(); renderOverview(); renderTimeline(); renderComparator(); renderAbout();
go("home");
</script>
